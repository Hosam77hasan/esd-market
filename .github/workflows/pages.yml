name: Deploy ESD Market to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare site files
        run: |
          mkdir -p dist
          cp esd_market.html dist/index.html
          cp esd_market.html bg_music.mp3 esd_market_hypermarket_transition.mp4 esd_market_hypermarket_transition_portrait.mp4 "logo esd market.jpg" "logo esd market.webp" og-image.jpg esd.jpg manifest.json sw.js dist/
          cp products.json dist/ 2>/dev/null || true
          cp -r icons dist/icons
          cp -r public dist/public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
